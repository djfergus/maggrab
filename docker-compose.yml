services:
  maggrab:
    build: .
    container_name: maggrab
    restart: unless-stopped
    ports:
      - "45001:45001"
    environment:
      - NODE_ENV=production
      - PORT=45001
      - DATA_DIR=/app/data
      - MYJD_EMAIL=${MYJD_EMAIL}
      - MYJD_PASSWORD=${MYJD_PASSWORD}
      - MYJD_DEVICE=${MYJD_DEVICE:-}
      # downup first via link-resolver (see resolver/); leave empty to use novafile only
      - DOWNUP_RESOLVER_URL=${DOWNUP_RESOLVER_URL:-}
      - DOWNUP_MAX_DEFER_MINUTES=${DOWNUP_MAX_DEFER_MINUTES:-180}
      - DOWNUP_LINK_TTL_MINUTES=${DOWNUP_LINK_TTL_MINUTES:-60}
      # Telegram alerts; leave empty to turn them off
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - maggrab_data:/app/data
    networks:
      default:
        gw_priority: 1
      resolver-net: {}

volumes:
  maggrab_data:
    driver: local

# Created by resolver/docker-compose.yml; start that project first
networks:
  resolver-net:
    external: true
